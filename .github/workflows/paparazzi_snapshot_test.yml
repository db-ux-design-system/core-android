---
name: Paparazzi Snapshot Verification

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  paparazzi:
    name: Verify Paparazzi Snapshots
    runs-on: ubuntu-latest
    env:
      PAPARAZZI_MODULES: "foundation components"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decrypt font file
        uses: ./.github/actions/decrypt-font
        with:
          passphrase: ${{ secrets.FONT_PASSPHRASE }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout develop branch for reference snapshots
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop-ref

      - name: Decrypt font file for develop reference
        uses: ./.github/actions/decrypt-font
        with:
          passphrase: ${{ secrets.FONT_PASSPHRASE }}
          working-directory: develop-ref

      - name: Record reference snapshots from develop
        run: |
          ./gradlew \
            $(printf ':%s:recordPaparazziDebug ' $PAPARAZZI_MODULES) \
            --continue
        working-directory: develop-ref
        continue-on-error: true

      - name: Copy reference snapshots to PR workspace
        run: |
          for module in $PAPARAZZI_MODULES; do
            mkdir -p ${module}/src/test/snapshots
            SNAPSHOT_SRC="develop-ref/${module}/src/test/snapshots"
            SNAPSHOT_DST="${module}/src/test/snapshots"
            if [ -d "$SNAPSHOT_SRC" ]; then
              rm -rf "$SNAPSHOT_DST"
              cp -r "$SNAPSHOT_SRC" "$SNAPSHOT_DST"
            else
              echo "No reference snapshots found for module" \
                "'${module}' on develop — skipping."
            fi
          done

      - name: Run Paparazzi verification
        id: paparazzi
        run: |
          ./gradlew \
            $(printf ':%s:verifyPaparazziDebug ' $PAPARAZZI_MODULES) \
            --continue
        continue-on-error: true

      - name: Check for snapshot deltas
        id: delta_check
        if: always()
        run: |
          DELTA_FILES=$(
            find . \
              -path "*/build/paparazzi/failures/delta-*" \
              -not -path "./develop-ref/*" \
              2>/dev/null || true
          )
          if [ -n "$DELTA_FILES" ]; then
            DELTA_COUNT=$(echo "$DELTA_FILES" | wc -l | tr -d ' ')
            echo "has_deltas=true" >> "$GITHUB_OUTPUT"
            echo "delta_count=$DELTA_COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "has_deltas=false" >> "$GITHUB_OUTPUT"
            echo "delta_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Paparazzi diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-diffs
          path: "**/build/paparazzi/failures/delta-*.png"
          if-no-files-found: ignore
          retention-days: 14

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const hasDeltasStr =
              '${{ steps.delta_check.outputs.has_deltas }}';
            const deltaCount =
              parseInt(
                '${{ steps.delta_check.outputs.delta_count }}',
                10
              ) || 0;
            const hasDeltas = hasDeltasStr === 'true';
            const runUrl =
              `${context.serverUrl}/` +
              `${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            let body;
            if (hasDeltas) {
              body = [
                '## ⚠️ Paparazzi Snapshot Differences Found',
                '',
                `**${deltaCount}** delta image(s) were detected in this PR.`,
                '',
                '> You can find the visual differences in the' +
                  ' Paparazzi report.',
                '',
                '📊 **[View Paparazzi Report (Actions Artifacts)]' +
                  `(${runUrl})**`,
                '',
                '> Download the `paparazzi-diffs` artifact to review' +
                  ' the differences.',
                '',
                '---',
                '_If the changes are intentional (e.g. new snapshot tests' +
                  ' were added), this comment can be ignored._',
              ].join('\n');
            } else {
              body = [
                '## ✅ Paparazzi Snapshots — No Differences',
                '',
                'All snapshots match the reference images.',
              ].join('\n');
            }

            const marker = '<!-- paparazzi-comment -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

            const existing =
              comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Warn on snapshot deltas
        if: >
          always() &&
          steps.delta_check.outputs.has_deltas == 'true'
        run: |
          echo "::warning::Paparazzi snapshot deltas detected \
            (${{ steps.delta_check.outputs.delta_count }} file(s)). \
            Download the 'paparazzi-diffs' artifact to review the differences."
