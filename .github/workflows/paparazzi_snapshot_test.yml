---
name: Paparazzi Snapshot Verification

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  PAPARAZZI_MODULES: "foundation components"

jobs:
  record:
    name: Record Reference Snapshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decrypt font file
        uses: ./.github/actions/decrypt-font
        with:
          passphrase: ${{ secrets.FONT_PASSPHRASE }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record reference snapshots from develop
        run: |
          read -ra modules <<< "$PAPARAZZI_MODULES"
          tasks=$(printf ':%s:recordPaparazziDebug ' "${modules[@]}")
          # shellcheck disable=SC2086
          ./gradlew $tasks --continue
        continue-on-error: true

      - name: Upload reference snapshots
        uses: actions/upload-artifact@v7
        with:
          name: reference-snapshots
          path: "**/src/test/snapshots/**"
          if-no-files-found: ignore
          retention-days: 1

  verify:
    name: Verify Paparazzi Snapshots
    runs-on: ubuntu-latest
    needs: record

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decrypt font file
        uses: ./.github/actions/decrypt-font
        with:
          passphrase: ${{ secrets.FONT_PASSPHRASE }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download reference snapshots
        id: download_snapshots
        uses: actions/download-artifact@v8
        with:
          name: reference-snapshots
        continue-on-error: true

      - name: Create empty snapshot directories if no reference exists
        if: steps.download_snapshots.outcome != 'success'
        run: |
          read -ra modules <<< "$PAPARAZZI_MODULES"
          for module in "${modules[@]}"; do
            mkdir -p "${module}/src/test/snapshots"
          done

      - name: Run Paparazzi verification
        run: |
          read -ra modules <<< "$PAPARAZZI_MODULES"
          tasks=$(printf ':%s:verifyPaparazziDebug ' "${modules[@]}")
          # shellcheck disable=SC2086
          ./gradlew $tasks --continue
        continue-on-error: true

      - name: Upload Paparazzi diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-diffs
          path: "**/build/paparazzi/failures/delta-*.png"
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report Snapshot Results
    runs-on: ubuntu-latest
    needs: verify
    if: always()

    steps:
      - name: Download Paparazzi diffs
        id: download_diffs
        uses: actions/download-artifact@v8
        with:
          name: paparazzi-diffs
          path: paparazzi-diffs
        continue-on-error: true

      - name: Check for snapshot deltas
        id: delta_check
        run: |
          DELTA_FILES=$(
            find paparazzi-diffs \
              -name "delta-*" \
              2>/dev/null || true
          )
          if [ -n "$DELTA_FILES" ]; then
            DELTA_COUNT=$(echo "$DELTA_FILES" | wc -l | tr -d ' ')
            echo "has_deltas=true" >> "$GITHUB_OUTPUT"
            echo "delta_count=$DELTA_COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "has_deltas=false" >> "$GITHUB_OUTPUT"
            echo "delta_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const hasDeltasStr =
              '${{ steps.delta_check.outputs.has_deltas }}';
            const deltaCount =
              parseInt(
                '${{ steps.delta_check.outputs.delta_count }}',
                10
              ) || 0;
            const hasDeltas = hasDeltasStr === 'true';
            const runUrl =
              `${context.serverUrl}/` +
              `${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            let body;
            if (hasDeltas) {
              body = [
                '## ⚠️ Paparazzi Snapshot Differences Found',
                '',
                `**${deltaCount}** delta image(s) were detected in this PR.`,
                '',
                '> You can find the visual differences in the' +
                  ' Paparazzi report.',
                '',
                '📊 **[View Paparazzi Report (Actions Artifacts)]' +
                  `(${runUrl})**`,
                '',
                '> Download the `paparazzi-diffs` artifact to review' +
                  ' the differences.',
                '',
                '---',
                '_If the changes are intentional (e.g. new snapshot' +
                  ' tests were added), this comment can be ignored._',
              ].join('\n');
            } else {
              body = [
                '## ✅ Paparazzi Snapshots — No Differences',
                '',
                'All snapshots match the reference images.',
              ].join('\n');
            }

            const marker = '<!-- paparazzi-comment -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

            const existing =
              comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Warn on snapshot deltas
        if: steps.delta_check.outputs.has_deltas == 'true'
        run: |
          echo "::warning::Paparazzi snapshot deltas detected \
            (${{ steps.delta_check.outputs.delta_count }} file(s)). \
            Download the 'paparazzi-diffs' artifact to review \
            the differences."
